# This workflow builds the libpurple plugins. It publishes the plugins as
# release assets.
#
# The workflow makes one build job for each unique "recipe" in plugins.json.
# The build job clones the plugin source at the specified sourceRef.
# The build job then runs the script recipes/<recipe>.sh.
# The script builds the plugin. It copies each .so file into $DIST.
# The script installs the Homebrew packages that it needs.
# Catalog entries that share a recipe must have the same sourceUrl and the
# same sourceRef.
#
# The build jobs run on macOS runners, because the plugins are arm64 macOS
# binaries. The setup job and the release job do not run the binaries.
# These two jobs run on Ubuntu runners. Ubuntu runners start faster. They
# also do not use the small macOS concurrency limit.
#
# Push a tag that matches "plugins-v*" to make a GitHub release.
# After the release, the workflow writes each asset URL and checksum into
# plugins.json. It pushes this change to main.

name: Build plugins

on:
  workflow_dispatch:
  push:
    tags:
      - "plugins-v*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: List recipes
        id: list
        run: echo "recipes=$(jq -c '[.plugins[].recipe] | unique' plugins.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.setup.outputs.recipes) }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Install common build dependencies
        run: |
          brew install pidgin glib json-glib gettext pkg-config

      - name: Clone pinned plugin source
        run: |
          URL=$(jq -r --arg recipe "${{ matrix.recipe }}" \
            'first(.plugins[] | select(.recipe == $recipe)) | .sourceUrl' plugins.json)
          REF=$(jq -r --arg recipe "${{ matrix.recipe }}" \
            'first(.plugins[] | select(.recipe == $recipe)) | .sourceRef' plugins.json)
          git clone --recurse-submodules "$URL.git" src
          git -C src checkout --recurse-submodules "$REF"

      - name: Run build recipe
        run: |
          mkdir -p dist
          export DIST="$GITHUB_WORKSPACE/dist"
          cd src
          bash "$GITHUB_WORKSPACE/recipes/${{ matrix.recipe }}.sh"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-${{ matrix.recipe }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin binaries
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist

      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.so > checksums.txt
          cat checksums.txt

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.so
            dist/checksums.txt

      - name: Check out main
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        uses: actions/checkout@v4
        with:
          ref: main
          path: catalog

      - name: Write the asset URLs and checksums into plugins.json
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        run: |
          cd catalog
          for f in ../dist/*.so; do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
            jq --arg name "$name" --arg sha "$sha" --arg url "$url" \
              '(.plugins[] | select(.filename == $name)) |= (.binaryUrl = $url | .sha256 = $sha)' \
              plugins.json > plugins.json.tmp
            mv plugins.json.tmp plugins.json
          done
          if git diff --quiet; then
            echo "plugins.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "Point plugins.json at the ${GITHUB_REF_NAME} assets"
          git push origin main
