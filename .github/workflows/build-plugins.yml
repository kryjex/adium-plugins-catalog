# Build the libpurple protocol plugins and publish them as release assets.
#
# The "setup" job reads the plugin list from plugins.json. The "build" job
# fans out into one matrix job per plugin. Each matrix job clones the plugin
# sourceUrl at its pinned sourceRef on Apple Silicon and runs the build
# recipe at recipes/<id>.sh. The "release" job merges the binaries, computes
# checksums, and (on a "plugins-v*" tag) cuts a GitHub Release.
#
# Recipe contract: the recipe runs inside the plugin source checkout. It
# builds the plugin and copies the produced .so files into $DIST. It installs
# its own extra Homebrew dependencies; the workflow installs only the common
# libpurple toolchain.
#
# The release assets feed plugins.json: after a release, copy each asset URL
# into binaryUrl and the matching line from checksums.txt into sha256. This
# workflow does not update plugins.json.
#
# Trigger this workflow by hand (workflow_dispatch), or push a tag that
# matches "plugins-v*" to also cut a GitHub Release.

name: Build plugins

on:
  workflow_dispatch:
  push:
    tags:
      - "plugins-v*"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: List plugins
        id: list
        run: echo "plugins=$(jq -c '[.plugins[].id]' plugins.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.setup.outputs.plugins) }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Install common build dependencies
        run: |
          brew install pidgin glib json-glib gettext pkg-config

      - name: Clone pinned plugin source
        run: |
          URL=$(jq -r --arg id "${{ matrix.plugin }}" \
            '.plugins[] | select(.id == $id) | .sourceUrl' plugins.json)
          REF=$(jq -r --arg id "${{ matrix.plugin }}" \
            '.plugins[] | select(.id == $id) | .sourceRef' plugins.json)
          git clone --recurse-submodules "$URL.git" src
          git -C src checkout --recurse-submodules "$REF"

      - name: Run build recipe
        run: |
          mkdir -p dist
          export DIST="$GITHUB_WORKSPACE/dist"
          cd src
          bash "$GITHUB_WORKSPACE/recipes/${{ matrix.plugin }}.sh"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-${{ matrix.plugin }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin binaries
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist

      - name: Compute checksums
        run: |
          cd dist
          sha256sum *.so > checksums.txt
          cat checksums.txt

      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.so
            dist/checksums.txt
