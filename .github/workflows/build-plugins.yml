# Build the libpurple protocol plugins and publish them as release assets.
#
# This workflow reads the pinned sourceRef of each plugin from plugins.json.
# It clones each upstream repository at that ref and builds it on Apple
# Silicon. The release assets feed plugins.json: after a release, copy each
# asset URL into binaryUrl and the matching line from checksums.txt into
# sha256. This workflow does not update plugins.json.
#
# Trigger this workflow by hand (workflow_dispatch), or push a tag that
# matches "plugins-v*" to also cut a GitHub Release.

name: Build plugins

on:
  workflow_dispatch:
  push:
    tags:
      - "plugins-v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install pidgin glib json-glib gettext opusfile gdk-pixbuf pkg-config go

      - name: Clone pinned plugin sources
        run: |
          TEAMS_REF=$(jq -r '.plugins[] | select(.id == "purple-teams") | .sourceRef' plugins.json)
          WA_REF=$(jq -r '.plugins[] | select(.id == "purple-gowhatsapp") | .sourceRef' plugins.json)
          git clone https://github.com/EionRobb/purple-teams.git build/purple-teams
          git -C build/purple-teams checkout "$TEAMS_REF"
          git clone --recurse-submodules https://github.com/hoehermann/purple-gowhatsapp.git build/purple-gowhatsapp
          git -C build/purple-gowhatsapp checkout --recurse-submodules "$WA_REF"

      - name: Build purple-teams
        run: |
          make -C build/purple-teams

      - name: Build purple-gowhatsapp
        run: |
          CGO_LDFLAGS="$(pkg-config --libs glib-2.0 purple opusfile gdk-pixbuf-2.0) -framework CoreFoundation -framework Security -lresolv"
          make -C build/purple-gowhatsapp libwhatsmeow.so CGO_LDFLAGS="$CGO_LDFLAGS"

      - name: Collect plugin binaries
        run: |
          mkdir -p dist
          cp build/purple-teams/libteams.so dist/
          if [ -f build/purple-teams/libteams-personal.so ]; then
            cp build/purple-teams/libteams-personal.so dist/
          fi
          cp build/purple-gowhatsapp/libwhatsmeow.so dist/

      - name: Compute checksums
        run: |
          cd dist
          shasum -a 256 *.so > checksums.txt
          cat checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugins
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.so
            dist/checksums.txt
